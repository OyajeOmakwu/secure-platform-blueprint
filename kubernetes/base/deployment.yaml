apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-platform-app
  namespace: secure-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-platform-app
  template:
    metadata:
      labels:
        app: secure-platform-app
    spec:
      containers:
        - name: app
          image: ghcr.io/example/secure-platform-app:v1.0.0
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
             